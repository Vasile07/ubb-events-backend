spring.application.name=ubb-events-backend
spring.config.import=optional:file:.env[.properties]
app.jwt.secret=${JWT_SECRET}

# Supabase PostgreSQL values are supplied through the environment at runtime.
spring.datasource.url=${SUPABASE_JDBC_URL:}
spring.datasource.username=${SUPABASE_DB_USERNAME:}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
