plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
    id 'org.springframework.boot'
}

group = 'com.ubb.events'
version = '0.0.1-SNAPSHOT'

java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }
repositories { mavenCentral() }
dependencyManagement { imports { mavenBom "org.springframework.boot:spring-boot-dependencies:${rootProject.springBootVersion}" } }
dependencies {
    implementation project(':Business')
    implementation project(':Model')
    implementation project(':Common')
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-jdbc'
    testRuntimeOnly 'com.h2database:h2'
}
tasks.withType(Test).configureEach { useJUnitPlatform() }
bootJar { archiveFileName = 'ubb-events-backend.jar' }
bootRun { workingDir rootProject.projectDir }
