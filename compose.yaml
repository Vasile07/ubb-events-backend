services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ubb-events-backend:local
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    environment:
      PORT: "${PORT:-10000}"
      SUPABASE_JDBC_URL: "${SUPABASE_JDBC_URL:?Set SUPABASE_JDBC_URL in the environment or local .env file}"
      SUPABASE_DB_USERNAME: "${SUPABASE_DB_USERNAME:?Set SUPABASE_DB_USERNAME in the environment or local .env file}"
      SUPABASE_DB_PASSWORD: "${SUPABASE_DB_PASSWORD:?Set SUPABASE_DB_PASSWORD in the environment or local .env file}"
      JWT_SECRET: "${JWT_SECRET:?Set JWT_SECRET in the environment or local .env file}"
